name: Deploy Podcast feed to Pages

# なぜ Actions でデプロイするか（2026-08-07 / Prompt208）:
#   旧方式（Actions 無しの legacy Pages ビルダー）は、mp3 が積もって
#   2.24GB になったこのリポジトリでビルドに失敗し、8/6 以降の配信が
#   黙って止まった。push は通るけんローカルからは正常に見えるのが厄介。
#   Actions なら shallow checkout（fetch-depth: 1）で巨大な履歴を引かず、
#   feed.xml + index.html + cover.jpg だけの軽い成果物を配信できる。
#   音声は Releases（タグ `episodes`）でホストしとる。

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fail_first:
        description: 'やり直しの試験（1回目のデプロイをわざと失敗させる）'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# 朝夜の publish が続けて走っても、最新の1本だけをデプロイする
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url || steps.d3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1  # ★履歴 2.24GB を引かんための肝

      - name: 配信する中身だけ集める（mp3 は Releases なので入れん）
        run: |
          set -euo pipefail
          mkdir -p _site
          cp feed.xml index.html _site/
          cp cover.jpg _site/ 2>/dev/null || echo "cover.jpg 無し（スキップ）"
          touch _site/.nojekyll
          echo "--- deploy する中身:"
          ls -la _site
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # ★成果物を上げた直後は、GitHub 側の一覧にまだ出とらんことがある
      #   （"No artifacts named github-pages" で失敗。2026-11 に多発。
      #    actions/deploy-pages issue 451）。少し待って、だめなら 2 回までやり直す。
      #   ※「Re-run」で回すと成果物が 2 つになって別の失敗になる。手で直す時は
      #     Actions 画面の「Run workflow」で新しく回すこと。
      - name: 成果物が一覧に出るまで少し待つ
        run: sleep 15

      - id: d1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ inputs.fail_first && 'retry-test-missing' || 'github-pages' }}

      - name: 1回目が失敗したので待つ
        if: steps.d1.outcome == 'failure'
        run: sleep 20
      - id: d2
        if: steps.d1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 2回目も失敗したので待つ
        if: steps.d2.outcome == 'failure'
        run: sleep 45
      - id: d3
        if: steps.d2.outcome == 'failure'
        uses: actions/deploy-pages@v4
